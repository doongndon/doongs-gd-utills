name: Build Daily Challenge

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "daily/**"
      - "common/**"
      - ".github/workflows/build-daily.yml"
  pull_request:
    paths:
      - "daily/**"
      - "common/**"
      - ".github/workflows/build-daily.yml"

jobs:
  build:
    name: ${{ matrix.config.name }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./daily
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: doongs-daily-challenge
          path: ${{ steps.build.outputs.build-output }}
