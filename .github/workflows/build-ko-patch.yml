name: Build Korean Patch

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "ko-patch/**"
      - "common/**"
      - ".github/workflows/build-ko-patch.yml"
  pull_request:
    paths:
      - "ko-patch/**"
      - "common/**"
      - ".github/workflows/build-ko-patch.yml"

jobs:
  fonts:
    name: Bake the fonts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 글자 그림판은 소스에 두지 않는다. 번역을 늘리면 담아야 할 글자도
      # 늘어나므로, 빌드할 때마다 글꼴 파일에서 새로 굽고 모든 플랫폼이
      # 같은 한 벌을 받아 쓴다.
      - name: Bake the atlases
        run: |
          set -euo pipefail
          pip install --quiet pillow
          python3 ko-patch/tools/make_atlas.py

      - uses: actions/upload-artifact@v4
        with:
          name: ko-patch-fonts
          path: ko-patch/resources
          retention-days: 1

  build:
    name: ${{ matrix.config.name }}
    needs: fonts
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: ko-patch-fonts
          path: ./ko-patch/resources

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./ko-patch
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: doongs-ko-patch
          path: ${{ steps.build.outputs.build-output }}
