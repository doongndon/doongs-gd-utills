name: Build Korean Patch

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "ko-patch/**"
      - ".github/workflows/build-ko-patch.yml"
  pull_request:
    paths:
      - "ko-patch/**"
      - ".github/workflows/build-ko-patch.yml"

jobs:
  check:
    name: Check charset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 번역을 추가하고 charset 갱신을 잊으면 그 글자가 아틀라스에서 빠져
      # 화면에 빈 칸으로 나온다. 조용히 깨지는 대신 여기서 멈추게 한다.
      - name: Charset must cover the translations
        run: python3 ko-patch/tools/sync_charset.py --check

  build:
    name: ${{ matrix.config.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: ./ko-patch
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v4
        with:
          name: doongs-ko-patch
          path: ${{ steps.build.outputs.build-output }}
