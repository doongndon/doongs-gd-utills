name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tag must match mod.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          declared=$(python3 -c "import json; print(json.load(open('mod.json'))['version'])")
          if [ "$declared" != "${{ github.ref_name }}" ]; then
            echo "mod.json says $declared but the tag is ${{ github.ref_name }}" >&2
            exit 1
          fi

  build:
    name: ${{ matrix.config.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest

          - name: macOS
            os: macos-latest

          - name: iOS
            os: macos-latest
            target: iOS

          - name: Android32
            os: ubuntu-latest
            target: Android32

          - name: Android64
            os: ubuntu-latest
            target: Android64

    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    env:
      INDEX_TOKEN: ${{ secrets.GEODE_INDEX_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      # 태그를 밀어서 온 것이면 그 이름을 쓰고, 손으로 돌렸으면 mod.json 의
      # 판본으로 짓는다. 태그 자체는 gh 가 릴리스를 만들며 함께 세워 준다.
      - name: Work out the tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            name="${{ github.ref_name }}"
          else
            name=$(python3 -c "import json; print(json.load(open('mod.json'))['version'])")
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Attach the .geode file to a GitHub release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=$(find "${{ steps.build.outputs.build-output }}" -name '*.geode' | head -n 1)
          if [ -z "$file" ]; then
            echo "the build produced no .geode file" >&2
            exit 1
          fi
          gh release create "${{ steps.tag.outputs.name }}" "$file" \
            --target "${{ github.sha }}" \
            --title "${{ steps.tag.outputs.name }}" --generate-notes
          echo "url=https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.name }}/$(basename "$file")" >> "$GITHUB_OUTPUT"

      # 인덱스에 처음 올리는 것만 사람이 한 번 해야 한다. 그 뒤로는 태그를 밀
      # 때마다 새 버전이 자동으로 올라간다. 토큰 시크릿이 없으면 조용히 건너뛴다.
      # 저장소에 모드가 둘이라 GitHub 의 "latest" 별칭은 쓸 수 없다. 그건
      # 저장소 전체에서 가장 최근 릴리스 하나만 가리켜서, 다른 모드를 올린
      # 순간 엉뚱한 곳을 짚는다. 그래서 모드마다 고정 태그를 두고 새 파일이
      # 나올 때마다 그 태그를 옮긴다. 모드 안의 업데이트 버튼이 보는 주소다.
      - name: Move the rolling tag to this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=$(find "${{ steps.build.outputs.build-output }}" -name '*.geode' | head -n 1)
          gh release delete "utils-latest" --yes --cleanup-tag || true
          gh release create "utils-latest" "$file" \
            --target "${{ github.sha }}" \
            --title "Newest Doong's GD Utils" \
            --notes "Always points at the newest build. Released as ${{ steps.tag.outputs.name }}." \
            --latest=false

      - name: Submit the new version to the Geode index
        if: ${{ env.INDEX_TOKEN != '' }}
        run: |
          set -euo pipefail
          id=$(python3 -c "import json; print(json.load(open('mod.json'))['id'])")
          curl -fsS -X POST "https://api.geode-sdk.org/v1/mods/$id/versions" \
            -H "Authorization: Bearer $INDEX_TOKEN" \
            -H "Content-Type: application/json" \
            -H "User-Agent: doongs-gd-utils-ci" \
            -d "{\"download_link\": \"${{ steps.publish.outputs.url }}\"}"
