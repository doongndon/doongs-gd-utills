# Render 에 올릴 때 쓰는 설정 파일. 오늘의 도전 서버(daily-server)를 띄운다.
# 저장소를 연결하면 이 내용을 읽어 알아서 설정해 준다.
#
# 이 파일이 인식되지 않으면 웹 화면에서 직접 다음과 같이 넣어도 된다.
#   Root Directory : daily-server
#   Build Command  : npm install
#   Start Command  : node server.js
#
# 무료 요금제의 디스크는 다시 띄울 때 비워진다. 그날의 순위표가 서버를 다시 띄울
# 때 사라질 수 있다는 뜻이다. 오래 남기려면 디스크를 붙이고 DATA_FILE 을 그 안으로
# 잡는다.
services:
  - type: web
    name: doongs-daily-server
    runtime: node
    plan: free
    rootDir: daily-server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
